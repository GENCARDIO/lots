name: lots_alex

services:
  app:
    build: .
    ports:
      - "5017:5017"
    environment:
      LOTS_ENV: development
      LOTS_IP_ADDRESS: http://172.16.82.45
      LOTS_DATA_DIR: /lots/DB
      LOTS_DOCS_DIR: /lots/DB/docs
      LOTS_DEBUG: "true"
      TZ: Europe/Madrid
    volumes:
      - type: bind
        source: /home/gencardio/Escriptori/lots_db
        target: /lots/DB
        bind:
          create_host_path: false
    command: ["python3", "lots.py"]
    restart: unless-stopped
